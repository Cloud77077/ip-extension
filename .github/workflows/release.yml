name: Publish IP Extension release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    if: github.event.head_commit.message == 'Release IP Extension v1.0.1'
    name: Build and publish IP Extension v1.0.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Build Chrome archive
        run: ./scripts/package.sh chrome

      - name: Build Firefox archive
        run: ./scripts/package.sh firefox

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: IP Extension v1.0.1
          generate_release_notes: true
          files: |
            dist/ip-extension-chrome.zip
            dist/ip-extension-firefox.zip
