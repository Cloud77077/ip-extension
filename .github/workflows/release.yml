name: Publish extension release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build and publish extension archives
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
      - name: Build Chrome archive
        run: ./scripts/package.sh chrome
      - name: Build Firefox archive
        run: ./scripts/package.sh firefox
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/hm-change-chrome.zip
            dist/hm-change-firefox.zip
